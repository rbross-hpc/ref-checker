[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "ref-checker"
version         = "0.3.0.dev0"
description     = "Verify bibliographic references against OpenAlex, CrossRef, DBLP, Semantic Scholar, and arXiv"
readme          = "README.md"
requires-python = ">=3.10"
license         = "BSD-3-Clause"
authors         = [{ name = "Robert Ross", email = "rross@anl.gov" }]
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ref-checker = "ref_checker.cli.main:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ref_checker*"]

[tool.setuptools.package-data]
ref_checker = ["skills/reference-checking/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Default rule set (pyflakes + a slice of pycodestyle) minus line-length,
# since the codebase doesn't currently wrap at 100 cols and enforcing it
# would produce a large reformatting diff unrelated to catching real bugs.
select = ["E4", "E7", "E9", "F"]
